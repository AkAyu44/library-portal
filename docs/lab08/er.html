<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}
.t{font:600 15px Segoe UI}.c{font:13px Consolas,monospace}.k{font:600 13px Consolas,monospace;fill:#b45309}
.note{font:13px Segoe UI;fill:#334155}
</style></head><body>
<svg width="1100" height="560" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker></defs>
<text x="20" y="32" style="font:700 20px Segoe UI" fill="#0f172a">Lab 8 — entity model (JPA) and tables (PostgreSQL)</text>
<!-- author -->
<rect x="20" y="70" width="260" height="190" rx="8" fill="#eef2ff" stroke="#1e3a8a" stroke-width="2"/>
<rect x="20" y="70" width="260" height="34" rx="8" fill="#1e3a8a"/><text x="34" y="93" class="t" fill="#fff">Author  →  table author</text>
<text x="34" y="128" class="k">PK id bigint (identity)</text>
<text x="34" y="150" class="c">name varchar(100) unique</text>
<text x="34" y="172" class="c">country varchar(60)</text>
<text x="34" y="204" class="c" fill="#6b7280">books: List&lt;Book&gt;</text>
<text x="34" y="222" class="c" fill="#6b7280">@OneToMany(mappedBy="author")</text>
<text x="34" y="244" class="note">inverse side — no column in author</text>
<!-- book -->
<rect x="400" y="70" width="330" height="330" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<rect x="400" y="70" width="330" height="34" rx="8" fill="#b45309"/><text x="414" y="93" class="t" fill="#fff">Book  →  table book</text>
<text x="414" y="128" class="k">PK id bigint (identity)</text>
<text x="414" y="150" class="c">title varchar(120) not null</text>
<text x="414" y="172" class="c">genre varchar(20) (EnumType.STRING)</text>
<text x="414" y="194" class="c">year int, archived, available</text>
<text x="414" y="216" class="c">published_on date</text>
<text x="414" y="238" class="c">created_at timestamptz (updatable=false)</text>
<text x="414" y="260" class="c">version bigint (@Version)</text>
<text x="414" y="290" class="k">FK author_id → author.id</text>
<text x="414" y="314" class="c" fill="#6b7280">@ManyToOne(LAZY) @JoinColumn</text>
<text x="414" y="342" class="c" fill="#6b7280">tags: Set&lt;Tag&gt; @ManyToMany</text>
<text x="414" y="360" class="c" fill="#6b7280">@JoinTable(name="book_tag")</text>
<text x="414" y="386" class="note">OWNING side of both associations</text>
<!-- tag -->
<rect x="830" y="70" width="250" height="140" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<rect x="830" y="70" width="250" height="34" rx="8" fill="#047857"/><text x="844" y="93" class="t" fill="#fff">Tag  →  table tag</text>
<text x="844" y="128" class="k">PK id bigint (identity)</text>
<text x="844" y="150" class="c">name varchar(40) unique</text>
<text x="844" y="182" class="note">no collection of books</text>
<text x="844" y="200" class="note">(unidirectional)</text>
<!-- book_tag -->
<rect x="830" y="300" width="250" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="830" y="300" width="250" height="34" rx="8" fill="#475569"/><text x="844" y="323" class="t" fill="#fff">join table book_tag</text>
<text x="844" y="358" class="k">PK,FK book_id → book.id</text>
<text x="844" y="380" class="k">PK,FK tag_id  → tag.id</text>
<text x="844" y="400" class="note">created by Hibernate from @JoinTable</text>
<!-- relations -->
<line x1="400" y1="290" x2="282" y2="160" stroke="#1e3a8a" stroke-width="2" marker-end="url(#a)"/>
<text x="292" y="150" style="font:700 15px Segoe UI" fill="#1e3a8a">1</text>
<text x="372" y="280" style="font:700 15px Segoe UI" fill="#1e3a8a">N</text>
<text x="40" y="300" class="note">book.author_id references author.id</text>
<line x1="730" y1="350" x2="828" y2="365" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="742" y="344" style="font:700 14px Segoe UI" fill="#475569">1 … N</text>
<line x1="955" y1="300" x2="955" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="962" y="240" style="font:700 14px Segoe UI" fill="#475569">N … 1</text>
<text x="742" y="262" style="font:700 15px Segoe UI" fill="#047857">Book N ↔ M Tag</text>
<rect x="20" y="440" width="1060" height="100" rx="8" fill="#f1f5f9"/>
<text x="36" y="468" class="note">Owning side = the side whose table holds the foreign key; JPA reads only it when writing. Book.author owns author_id (@JoinColumn);</text>
<text x="36" y="490" class="note">Author.books has mappedBy="author" → inverse, no column. Book.tags declares @JoinTable → owns book_tag. Author.addBook() sets both sides.</text>
<text x="36" y="512" class="note">Cascade ALL + orphanRemoval on Author.books: deleting an author deletes its books; removing a book from the list deletes the book row.</text>
</svg></body></html>
