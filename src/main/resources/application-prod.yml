spring:
  config:
    activate:
      on-profile: prod

  # Lab 8: production never creates or drops tables; the schema must already match the entities
  # (in a real project it is created by migrations — Flyway/Liquibase)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 8080

app:
  mail:
    retry-count: 5
    enabled: true

# Lab 7: the API description and its test console must not be public in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    kz.iitu.library: WARN
