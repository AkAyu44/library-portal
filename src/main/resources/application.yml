# Lab 3: shared configuration (application.properties was replaced by YAML)
spring:
  application:
    name: library-portal
  thymeleaf:
    cache: false
  messages:
    # Lab 6: without this a locale with no own bundle (en) falls back to the OS locale
    fallback-to-system-locale: false
  # Lab 8: PostgreSQL instead of the in-memory list
  datasource:
    url: jdbc:postgresql://localhost:5432/springlab
    username: springlab
    password: springlab
  jpa:
    open-in-view: false          # no lazy loading during view rendering: the service is the boundary
    hibernate:
      ddl-auto: create-drop      # for this class only: schema from the entities, dropped on shutdown
    show-sql: true               # you will need to read the SQL
    properties:
      hibernate.format_sql: true
  data:
    web:
      pageable:
        max-page-size: 50        # ?size=100000 cannot ask for the whole table

server:
  port: 8080

app:
  owner: "Bektursyn Kuat"
  group: "IT1-2409IS"
  date-pattern: "yyyy-MM-dd HH:mm:ss"
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  cache:                # Lab 3, variant 7 — used by CitationCache (Lab 5 citations)
    ttl: 1m
    max-entries: 100

logging:
  level:
    kz.iitu.library: INFO

# Lab 7: OpenAPI document at /v3/api-docs, Swagger UI at /swagger-ui.html;
# only the REST API is documented, not the Thymeleaf pages or Actuator
springdoc:
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions,beans
  endpoint:
    env:
      show-values: always
